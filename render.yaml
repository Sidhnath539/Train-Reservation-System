services:
  - type: web
    name: railora-reservation-system
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
        # Enter your MySQL connection string from Railway, Aiven, or TiDB Cloud:
        # e.g., mysql://user:password@host:port/database?ssl={"rejectUnauthorized":false}
