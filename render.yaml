services:
  - type: web
    name: railway-reservation-system
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: railway-db
          property: connectionString

databases:
  - name: railway-db
    plan: free
    databaseName: railway_db
    user: railway_user
