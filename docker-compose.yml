services:
  db:
    image: mysql:8.0
    container_name: railora-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: railway_db
      MYSQL_USER: railway_user
      MYSQL_PASSWORD: railway_password
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/railway.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  web:
    build: .
    container_name: railora-web
    restart: always
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: railway_user
      DB_PASSWORD: railway_password
      DB_NAME: railway_db
      JWT_SECRET: railora_production_secret_key_jwt_2026
    depends_on:
      db:
        condition: service_healthy

volumes:
  mysql_data:

